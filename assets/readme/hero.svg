<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">东晟 AI 健康管家</title>
  <desc id="desc">一个以安全护栏组织文字问答、图片可见信息与受控资料匹配的日常健康信息服务；明确不做诊断、处方或治疗。</desc>
  <rect width="1200" height="380" rx="30" fill="#FAF7EF"/>
  <path d="M64 80H1136M64 300H1136" stroke="#D7E1D5" stroke-width="2"/>
  <g id="title-block" transform="translate(72 76)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
