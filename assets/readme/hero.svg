      <text x="68" y="35" fill="#355C3D" font-size="22" font-weight="700">不做诊断、处方或治疗</text>
    </g>
  </g>
  <g id="guardrail-flow" transform="translate(610 62)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
