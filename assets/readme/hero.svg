      <text x="52" y="56" fill="#55705A" font-size="20">条件匹配</text>
    </g>
    <path d="M170 69H196M170 161H196M170 253H196" stroke="#9CB49C" stroke-width="4" stroke-linecap="round"/>
    <g transform="translate(212 78)">
