<!doctype html>
<html lang="zh"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI健康管家</title>
<style>
  :root{--primary:#4149C9; --deep:#082D73; --grey:#9296A3; --input-bg:#F6F8FA;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;background:#0a1a3a}
  .phone{position:relative;width:100%;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:#000;display:flex;flex-direction:column}
  .bg{position:absolute;inset:0;background:url('./page-background.png') center/cover no-repeat;z-index:0}
  .statusbar{position:relative;height:calc(12px + env(safe-area-inset-top));z-index:4;flex:none}
  .new-chat{position:absolute;right:20px;top:calc(14px + env(safe-area-inset-top));z-index:6;border:0;border-radius:16px;padding:7px 12px;background:rgba(255,255,255,.9);color:var(--deep);font-size:13px}
  .memory-toggle{position:absolute;left:20px;top:calc(14px + env(safe-area-inset-top));z-index:6;border:1px solid rgba(255,255,255,.65);border-radius:16px;padding:7px 12px;background:rgba(8,45,115,.72);color:#fff;font-size:13px}
  .memory-toggle[aria-checked="true"]{background:#fff;color:var(--deep);border-color:#fff}
  .scroll{position:relative;flex:1;overflow-y:auto;z-index:2;display:flex;flex-direction:column;padding:0 20px 10px}
  .scroll::-webkit-scrollbar{display:none}
  .hero{position:relative;flex:none;min-height:400px}
  .char{position:absolute;left:-6%;top:-18px;width:76%;filter:drop-shadow(0 8px 22px rgba(0,0,0,.22))}
  .intro{position:absolute;left:42%;right:0;top:138px;color:#fff}
  .intro h1{font-size:42px;font-weight:800;letter-spacing:1px;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.3)}
  .intro p{margin-top:18px;font-size:16px;line-height:2.05;color:#fff;font-weight:500;text-shadow:0 1px 6px rgba(0,0,0,.28)}
  .msgs{display:flex;flex-direction:column;gap:14px;padding-top:4px}
  .msg{max-width:80%;padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.65;word-break:break-word;white-space:pre-wrap}
  .msg.user{align-self:flex-end;background:linear-gradient(135deg,#5B6EF5,#4149C9);color:#fff;border-bottom-right-radius:5px;box-shadow:0 2px 10px rgba(65,73,201,.25)}
  .ai-row{display:flex;gap:9px;align-items:flex-start;align-self:flex-start;max-width:88%}
  .ai-row .avatar{width:36px;height:36px;border-radius:50%;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .ai-row .msg.ai{background:#fff;color:#1a2233;border-bottom-left-radius:5px;box-shadow:0 2px 12px rgba(8,45,115,.14)}
  .dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--grey);animation:bl 1.2s infinite}
  .dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
  @keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}
  .panel{position:relative;z-index:5;flex:none;background:#fff;border-radius:28px 28px 0 0;
    padding:16px 20px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(8,45,115,.12)}
  .memory-hint{margin:0 6px 10px;color:#687083;font-size:12px;line-height:1.4}
  .inputbar{display:flex;align-items:center;gap:12px;background:var(--input-bg);border-radius:34px;padding:9px 12px 9px 9px}
  .ai-btn{width:54px;height:54px;border-radius:50%;background:#fff;flex:none;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(65,73,201,.14)}
  .ai-btn img{width:32px;height:32px}
  .inputbar input{flex:1;border:none;outline:none;background:transparent;color:#1a2233;font-size:16px}
  .inputbar input::placeholder{color:var(--grey)}
  .add{width:32px;height:32px;flex:none;margin-right:6px;cursor:pointer}
</style></head>
<body>
<div class="phone">
  <div class="bg"></div>
  <div class="statusbar"></div>
  <button class="memory-toggle" id="memoryToggle" type="button" role="switch" aria-checked="false">7天记忆：关</button>
  <button class="new-chat" id="newChat" type="button">新对话</button>
  <div class="scroll" id="scroll">
    <div class="hero" id="hero">
      <img class="char" src="./ai-health-manager.png" alt="AI健康管家">
      <div class="intro">
        <h1>HI,</h1>
        <p>我是您的Ai体重管理师 ， 我可以帮你分析体重数据、分析体检报告、解读健康状况等,您可以随时跟我沟通,我乐意为您效劳……</p>
      </div>
    </div>
    <div class="msgs" id="msgs"></div>
  </div>
  <div class="panel">
    <div class="memory-hint" id="memoryHint">最近对话不会在本机保留 7 天</div>
    <div class="inputbar">
      <div class="ai-btn"><img src="./icons/ai-assistant.svg" alt="AI"></div>
      <input id="q" maxlength="1500" placeholder="你有什么想知道的,请输入" enterkeyhint="send">
      <img class="add" id="tongue" src="./icons/add.svg" alt="上传舌诊">
      <input type="file" id="file" accept="image/*" style="display:none">
    </div>
  </div>
</div>

<script src="./app.js" defer></script>
</body></html>
